name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigas da mesma branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: frozen install + lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.5.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate migration inputs (no migration apply)
        run: pnpm migration:validate

      - name: Lint
        run: pnpm -w run lint

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Test
        run: pnpm -w run test

      - name: Build
        run: pnpm -w run build

      - name: Release identity
        env:
          RELEASE_VERSION: 0.0.0-ci
          RELEASE_COMMIT: ${{ github.sha }}
        run: pnpm release:identity
