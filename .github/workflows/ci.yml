name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigas da mesma branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: frozen install + lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.5.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/propensity-worker/requirements*.txt

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install propensity worker dependencies
        run: python -m pip install --requirement apps/propensity-worker/requirements-dev.txt

      - name: Validate migration inputs (no migration apply)
        run: pnpm migration:validate

      - name: Lint
        run: pnpm -w run lint

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Test
        run: pnpm -w run test

      - name: Product analytics runtime
        run: pnpm test:product-analytics

      - name: Order 140 regression gates
        run: |
          pnpm test:onboarding
          pnpm test:app-shell
          pnpm test:demo-workspace
          pnpm test:prebeta
          pnpm test:opportunities
          pnpm test:decisions

      - name: Build
        run: pnpm -w run build

      - name: Release identity
        env:
          RELEASE_VERSION: 0.0.0-ci
          RELEASE_COMMIT: ${{ github.sha }}
        run: pnpm release:identity
